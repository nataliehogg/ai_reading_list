# AI reading list — the single source of truth for the site.
#
# Add a new entry anywhere: the site lists entries alphabetically by the
# surname of the first author (the last word before any comma), then title.
# Only `title`, `url`, `type` and `added` are required. Every tag is clickable
# on the site and filters the list, so tag freely.
#
#   - title: The title as published
#     url: https://...
#     type: paper | essay | news | interview | resource
#     added: 2026-10-20            # date you added it to the list
#     authors: Jane Doe, John Roe  # optional, free text
#     sort_as: Doe                 # optional; overrides the surname used for ordering
#     published: 2026-02-10        # optional; a full date or just a year
#     field: [cosmology, law]      # optional; the authors' field(s) of origin
#     tags: [labour, big tech]     # optional; themes, as many as you like
#     start_here: true             # optional; one of the essential picks
#     note: Short comment.         # optional
#
# Things not yet read live in to-read.yaml, which is checked but not published.

