<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI reading list – Natalie B. Hogg</title>
  <meta name="description" content="A curated, searchable list of papers, essays and journalism about AI.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="AI reading list">
  <meta property="og:description" content="{{count}} papers, essays and articles about AI, curated by Natalie B. Hogg.">
  <meta property="og:url" content="{{site_url}}">
  <link rel="canonical" href="{{site_url}}">
  <link rel="icon" href="static/favicon.svg" type="image/svg+xml">
  <link rel="alternate" type="application/atom+xml" title="AI reading list – new additions" href="feed.xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
  <link rel="stylesheet" href="static/style.css?v={{css_v}}">
  <script>document.documentElement.classList.add("js");</script>
</head>
<body>
  <a class="skip" href="#list">Skip to the list</a>

  <header class="site-header">
    <div class="site-id">
      <a class="site-title" href="https://nataliebhogg.com/">Natalie B. Hogg</a>
      <span class="site-tagline">Cosmologist</span>
    </div>
    <nav class="site-nav" aria-label="Site">
      <a href="https://nataliebhogg.com/">Home</a>
      <a href="https://nataliebhogg.com/blog/">Writing</a>
      <a href="https://nataliebhogg.com/speaking/">Speaking</a>
      <a href="https://nataliebhogg.com/cv/">CV</a>
    </nav>
  </header>

  <main class="page">
    <h1>AI reading list</h1>

    <div class="controls">
      <input id="q" class="search" type="search" placeholder="Search titles, authors, notes and tags" autocomplete="off" spellcheck="false" aria-label="Search">
      <p class="hint">Click any tag to filter the list, or <a href="#tags">browse all tags</a>. New here? <a href="?start=yes" data-kind="start" data-value="yes">Start here</a>.</p>
      <div class="status">
        <p class="count" aria-live="polite">{{count}} readings</p>
        <div class="active" hidden></div>
      </div>
    </div>

    <ol class="list" id="list">
{{items}}
    </ol>
    <p class="empty" hidden>Nothing matches. <button type="button" class="clear">Show everything</button></p>

    <section class="tag-index" id="tags" aria-labelledby="tags-heading">
      <h2 id="tags-heading">All tags</h2>
{{tag_index}}
    </section>

    <footer class="footer">
      <p>Last updated {{updated}}. <a href="feed.xml">Atom feed</a> · <a href="readings.json">JSON</a> · <a href="{{repo_url}}">Source</a></p>
    </footer>
  </main>

  <script src="static/app.js?v={{js_v}}" defer></script>
</body>
</html>
